services:
  spongebot:
    build: .
    container_name: spongebot
    env_file:
      - .env
    volumes:
      - ./wishlist.json:/app/wishlist.json
    restart: unless-stopped
    # optional: keep logs bounded
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"